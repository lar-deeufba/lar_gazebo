serial_number: "a200-0000"
version: 0
system:
  username: root
  hosts:
    - hostname: a200-0000
      ip: 192.168.131.1
  ros2:
    namespace: "a200_0000"
    domain_id: 0
platform:
  model: husky
sensors:
  lidar3d:
    - model: velodyne_lidar
      urdf_enabled: true
      launch_enabled: true
      parent: "default_mount"
      xyz: [0.0, 0.0, 0.8] 
      rpy: [0.0, 0.0, 0.0]
  camera:
    - model: flir_blackfly # Standard Machine Vision Mono Camera
      urdf_enabled: true
      launch_enabled: true
      parent: "default_mount"
      xyz: [0.45, 0.0, 0.2] 
      rpy: [0.0, 0.0, 0.0]
  gps:
    - model: garmin_18x
      urdf_enabled: true
      launch_enabled: true
      parent: "default_mount"
      xyz: [-0.2, 0.0, 0.2] 
      rpy: [0.0, 0.0, 0.0]
  imu:
    - model: microstrain_imu # High-precision external IMU
      urdf_enabled: true
      launch_enabled: true
      parent: "default_mount"
      xyz: [0.0, 0.0, 0.15] 
      rpy: [0.0, 0.0, 0.0]